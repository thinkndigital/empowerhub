name: CI / Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
      - claude/laughing-hopper-vajfwr
      - claude/empowerhub0-context-lv8h4j
      - claude/affectionate-ramanujan-rbvqv1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCufQtfjRhee0FHei0PIVSPJ0eTQISlKgk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-4511819966-bc14f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4511819966-bc14f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-4511819966-bc14f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "822244663005"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:822244663005:web:2bbd7b3b2a819f1e2c0534"

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy to Firebase App Hosting
        run: |
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          BUILD_ID="ci-${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          PROJECT="studio-4511819966-bc14f"
          LOCATION="us-central1"
          BACKEND="studio"
          BASE="https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT}/locations/${LOCATION}/backends/${BACKEND}"

          echo "Creating build ${BUILD_ID} from branch ${BRANCH}"
          HTTP_CODE=$(curl -s -o /tmp/build_resp.json -w "%{http_code}" -X POST \
            "${BASE}/builds?buildId=${BUILD_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"source\":{\"codebase\":{\"branch\":\"${BRANCH}\"}}}")
          echo "Build response (HTTP ${HTTP_CODE}): $(cat /tmp/build_resp.json)"
          [ "${HTTP_CODE}" -lt 400 ] || { echo "Build creation failed"; exit 1; }

          echo "Creating rollout from build ${BUILD_ID}"
          HTTP_CODE=$(curl -s -o /tmp/rollout_resp.json -w "%{http_code}" -X POST \
            "${BASE}/rollouts" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"build\":\"projects/${PROJECT}/locations/${LOCATION}/backends/${BACKEND}/builds/${BUILD_ID}\"}")
          echo "Rollout response (HTTP ${HTTP_CODE}): $(cat /tmp/rollout_resp.json)"
          [ "${HTTP_CODE}" -lt 400 ] || { echo "Rollout creation failed"; exit 1; }

          echo "Deploy initiated successfully for branch ${BRANCH}"
