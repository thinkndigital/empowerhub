name: CI / Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
      - claude/laughing-hopper-vajfwr
      - claude/empowerhub0-context-lv8h4j
      - claude/affectionate-ramanujan-rbvqv1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCufQtfjRhee0FHei0PIVSPJ0eTQISlKgk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-4511819966-bc14f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4511819966-bc14f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-4511819966-bc14f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "822244663005"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:822244663005:web:2bbd7b3b2a819f1e2c0534"

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy to Firebase App Hosting
        run: |
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa.json'))['project_id'])")
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          BRANCH="${{ github.ref_name }}"
          BACKEND_NAME="projects/${PROJECT_ID}/locations/us-central1/backends/studio"

          echo "=== Step 1: Create Build from branch: $BRANCH ==="
          BUILD_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://firebaseapphosting.googleapis.com/v1beta/${BACKEND_NAME}/builds" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"source\":{\"codebase\":{\"branch\":\"${BRANCH}\"}}}")

          BUILD_HTTP=$(echo "$BUILD_RESP" | grep -oP '(?<=HTTP_STATUS:)\d+')
          BUILD_BODY=$(echo "$BUILD_RESP" | sed '/HTTP_STATUS:/d')
          echo "Build status: $BUILD_HTTP"
          echo "Build response: $BUILD_BODY"

          BUILD_NAME=$(echo "$BUILD_BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('name','') or d.get('metadata',{}).get('build',{}).get('name',''))")

          if [ -z "$BUILD_NAME" ] || [ "$BUILD_HTTP" != "200" ] && [ "$BUILD_HTTP" != "201" ]; then
            echo "Build creation failed (HTTP $BUILD_HTTP)"
            exit 1
          fi

          echo "Build created: $BUILD_NAME"

          echo "=== Step 2: Create Rollout using build ==="
          ROLLOUT_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://firebaseapphosting.googleapis.com/v1beta/${BACKEND_NAME}/rollouts" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"build\":\"${BUILD_NAME}\"}")

          ROLLOUT_HTTP=$(echo "$ROLLOUT_RESP" | grep -oP '(?<=HTTP_STATUS:)\d+')
          ROLLOUT_BODY=$(echo "$ROLLOUT_RESP" | sed '/HTTP_STATUS:/d')
          echo "Rollout status: $ROLLOUT_HTTP"
          echo "Rollout response: $ROLLOUT_BODY"

          if [ "$ROLLOUT_HTTP" = "200" ] || [ "$ROLLOUT_HTTP" = "201" ]; then
            echo "Rollout created — Firebase App Hosting will build and deploy."
          else
            echo "Rollout creation failed (HTTP $ROLLOUT_HTTP)"
            exit 1
          fi
