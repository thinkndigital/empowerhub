name: CI / Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
      - claude/laughing-hopper-vajfwr
      - claude/empowerhub0-context-lv8h4j
      - claude/affectionate-ramanujan-rbvqv1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCufQtfjRhee0FHei0PIVSPJ0eTQISlKgk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-4511819966-bc14f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4511819966-bc14f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-4511819966-bc14f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "822244663005"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:822244663005:web:2bbd7b3b2a819f1e2c0534"

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy to Firebase App Hosting
        run: |
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa.json'))['project_id'])")
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          BRANCH="${{ github.ref_name }}"

          echo "=== Listing App Hosting Backends (all locations) ==="
          BACKENDS_JSON=$(curl -sf \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/locations/-/backends" \
            -H "Authorization: Bearer $ACCESS_TOKEN") || {
            echo "App Hosting API call failed. Trying us-central1 explicitly..."
            BACKENDS_JSON=$(curl -sf \
              "https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/locations/us-central1/backends" \
              -H "Authorization: Bearer $ACCESS_TOKEN") || BACKENDS_JSON="{}"
          }
          echo "Backends response: $BACKENDS_JSON"

          BACKEND_NAME=$(echo "$BACKENDS_JSON" | python3 -c "
import json, sys
data = json.load(sys.stdin)
backends = data.get('backends', [])
if backends:
    b = backends[0]
    print(b['name'])
    import sys
    print(f'  live_branch: {b.get(\"codebase\",{}).get(\"branch\",\"unknown\")}', file=sys.stderr)
else:
    print('')
" 2>&1 | head -1)

          if [ -z "$BACKEND_NAME" ]; then
            echo "ERROR: No App Hosting backend found."
            echo "Please set up Firebase App Hosting in the Firebase console first."
            echo "See: https://firebase.google.com/docs/app-hosting/get-started"
            exit 1
          fi

          echo "=== Found backend: $BACKEND_NAME ==="
          echo "=== Triggering rollout for branch: $BRANCH ==="

          ROLLOUT_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://firebaseapphosting.googleapis.com/v1beta/${BACKEND_NAME}/rollouts" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"build\": {\"source\": {\"codebase\": {\"branch\": \"${BRANCH}\"}}}}")

          HTTP_STATUS=$(echo "$ROLLOUT_RESP" | grep -oP '(?<=HTTP_STATUS:)\d+')
          ROLLOUT_BODY=$(echo "$ROLLOUT_RESP" | sed '/HTTP_STATUS:/d')
          echo "Rollout status: $HTTP_STATUS"
          echo "Rollout body: $ROLLOUT_BODY"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            ROLLOUT_ID=$(echo "$ROLLOUT_BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('name','').split('/')[-1])" 2>/dev/null)
            echo "✓ Rollout created: $ROLLOUT_ID"
            echo "Deploy triggered — Firebase App Hosting will build and publish the app."
          else
            echo "✗ Rollout creation failed (HTTP $HTTP_STATUS)"
            echo "Body: $ROLLOUT_BODY"
            exit 1
          fi
