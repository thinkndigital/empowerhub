name: CI / Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - claude/laughing-hopper-vajfwr
      - claude/empowerhub0-context-lv8h4j
      - claude/affectionate-ramanujan-rbvqv1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCufQtfjRhee0FHei0PIVSPJ0eTQISlKgk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-4511819966-bc14f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4511819966-bc14f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-4511819966-bc14f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "822244663005"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:822244663005:web:2bbd7b3b2a819f1e2c0534"

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Authenticate to Google Cloud
        run: gcloud auth activate-service-account --key-file=/tmp/sa.json

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE="us-central1-docker.pkg.dev/studio-4511819966-bc14f/empowerhub/app:${{ github.sha }}"
          docker build -t "${IMAGE}" .
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update studio \
            --image="${IMAGE}" \
            --project=studio-4511819966-bc14f \
            --region=us-central1 \
            --quiet
          echo "=== Deployed successfully ==="
          echo "URL: https://studio-bkmodeaqwa-uc.a.run.app"
