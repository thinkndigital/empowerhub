name: CI / Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
      - claude/laughing-hopper-vajfwr
      - claude/empowerhub0-context-lv8h4j

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCufQtfjRhee0FHei0PIVSPJ0eTQISlKgk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-4511819966-bc14f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4511819966-bc14f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-4511819966-bc14f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "822244663005"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:822244663005:web:2bbd7b3b2a819f1e2c0534"

      - name: Deploy via Firebase App Hosting
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

          # Get the App Hosting backend ID for this project
          BACKENDS_JSON=$(npx firebase-tools@latest apphosting:backends:list \
            --project studio-4511819966-bc14f --json 2>/dev/null || echo "[]")

          BACKEND_ID=$(node -e "
            try {
              const d = require('fs').readFileSync('/dev/stdin','utf8');
              const j = JSON.parse(d);
              const arr = Array.isArray(j) ? j : (j.result || []);
              const name = arr[0]?.name || '';
              console.log(name.split('/').pop() || '');
            } catch(e) { console.log(''); }
          " <<< "$BACKENDS_JSON")

          if [ -n "$BACKEND_ID" ]; then
            echo "Triggering App Hosting build for backend: $BACKEND_ID"
            npx firebase-tools@latest apphosting:builds:create "$BACKEND_ID" \
              --project studio-4511819966-bc14f \
              --git-branch "${{ github.ref_name }}" || \
              echo "::warning::App Hosting build trigger failed – check FIREBASE_SERVICE_ACCOUNT permissions"
          else
            echo "::warning::No App Hosting backend found for project studio-4511819966-bc14f"
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
