name: CI / Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
      - claude/laughing-hopper-vajfwr
      - claude/empowerhub0-context-lv8h4j
      - claude/affectionate-ramanujan-rbvqv1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCufQtfjRhee0FHei0PIVSPJ0eTQISlKgk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-4511819966-bc14f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4511819966-bc14f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-4511819966-bc14f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "822244663005"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:822244663005:web:2bbd7b3b2a819f1e2c0534"

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy to Firebase App Hosting
        run: |
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa.json'))['project_id'])")
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          BRANCH="${{ github.ref_name }}"

          echo "=== Listing App Hosting Backends ==="
          BACKENDS_JSON=$(curl -sf "https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/locations/-/backends" -H "Authorization: Bearer $ACCESS_TOKEN" || curl -sf "https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/locations/us-central1/backends" -H "Authorization: Bearer $ACCESS_TOKEN" || echo "{}")
          echo "Backends: $BACKENDS_JSON"

          BACKEND_NAME=$(echo "$BACKENDS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); backends=d.get('backends',[]); print(backends[0]['name'] if backends else '')")

          if [ -z "$BACKEND_NAME" ]; then
            echo "ERROR: No App Hosting backend found. Set up Firebase App Hosting in the console first."
            exit 1
          fi

          echo "Backend: $BACKEND_NAME"
          echo "Triggering rollout for branch: $BRANCH"

          ROLLOUT=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://firebaseapphosting.googleapis.com/v1beta/${BACKEND_NAME}/rollouts" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"build\":{\"source\":{\"codebase\":{\"branch\":\"${BRANCH}\"}}}}")

          HTTP_STATUS=$(echo "$ROLLOUT" | grep -oP '(?<=HTTP_STATUS:)\d+')
          BODY=$(echo "$ROLLOUT" | sed '/HTTP_STATUS:/d')
          echo "Status: $HTTP_STATUS  Body: $BODY"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "Rollout created successfully — Firebase App Hosting will build and publish."
          else
            echo "Rollout creation failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
