name: CI / Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
      - claude/laughing-hopper-vajfwr
      - claude/empowerhub0-context-lv8h4j

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCufQtfjRhee0FHei0PIVSPJ0eTQISlKgk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-4511819966-bc14f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4511819966-bc14f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-4511819966-bc14f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "822244663005"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:822244663005:web:2bbd7b3b2a819f1e2c0534"

      - name: Deploy via Firebase App Hosting
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa.json'))['project_id'])")
          echo "Project: $PROJECT_ID"

          # Authenticate with gcloud using service account
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          # List App Hosting backends
          echo "--- Listing backends ---"
          curl -s \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/backends" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -o /tmp/backends.json
          cat /tmp/backends.json

          # Write helper script to extract backend ID
          cat > /tmp/get_backend.py << 'PYEOF'
          import json, sys
          d = json.load(open('/tmp/backends.json'))
          backends = d.get('backends', [])
          if backends:
              print(backends[0]['name'].split('/')[-1])
          PYEOF

          BACKEND_ID=$(python3 /tmp/get_backend.py 2>/dev/null || echo "")

          if [ -z "$BACKEND_ID" ]; then
            echo "::error::No App Hosting backend found. Ensure the service account has roles/firebaseapphosting.admin"
            exit 1
          fi

          echo "--- Triggering build for backend: $BACKEND_ID on branch: $DEPLOY_BRANCH ---"
          curl -s -X POST \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/backends/${BACKEND_ID}/builds" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"source\":{\"codebase\":{\"branch\":\"${DEPLOY_BRANCH}\"}}}" \
            -o /tmp/build_response.json
          cat /tmp/build_response.json

          # Check for API error
          cat > /tmp/check_error.py << 'PYEOF'
          import json, sys
          d = json.load(open('/tmp/build_response.json'))
          err = d.get('error', {}).get('message', '')
          if err:
              print(f"Build API error: {err}", file=sys.stderr)
              sys.exit(1)
          print("Build triggered successfully!")
          PYEOF

          python3 /tmp/check_error.py
