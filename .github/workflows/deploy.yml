name: CI / Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
      - claude/laughing-hopper-vajfwr
      - claude/empowerhub0-context-lv8h4j

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCufQtfjRhee0FHei0PIVSPJ0eTQISlKgk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-4511819966-bc14f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4511819966-bc14f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-4511819966-bc14f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "822244663005"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:822244663005:web:2bbd7b3b2a819f1e2c0534"

      - name: Deploy via Firebase App Hosting
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa.json'))['project_id'])")

          # Authenticate with gcloud using the service account
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          # List App Hosting backends (with full error output)
          echo "--- Listing App Hosting backends for project: $PROJECT_ID ---"
          BACKENDS_JSON=$(curl -s \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/backends" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "Response: $BACKENDS_JSON"

          # Extract first backend ID
          BACKEND_ID=$(python3 -c "
import sys, json
d = json.loads('''$BACKENDS_JSON''')
backends = d.get('backends', [])
if backends:
    print(backends[0]['name'].split('/')[-1])
else:
    print('')
" 2>/dev/null || echo "")

          if [ -z "$BACKEND_ID" ]; then
            echo "::error::Could not find an App Hosting backend. Check service account permissions (needs roles/firebaseapphosting.admin)."
            exit 1
          fi

          echo "--- Triggering build for backend: $BACKEND_ID on branch: ${{ github.ref_name }} ---"
          BUILD_RESP=$(curl -s -X POST \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/backends/${BACKEND_ID}/builds" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"source\":{\"codebase\":{\"branch\":\"${{ github.ref_name }}\"}}}")
          echo "Build response: $BUILD_RESP"

          # Check for error in response
          ERROR=$(python3 -c "
import sys, json
d = json.loads('''$BUILD_RESP''')
print(d.get('error', {}).get('message', ''))
" 2>/dev/null || echo "")

          if [ -n "$ERROR" ]; then
            echo "::error::Build trigger failed: $ERROR"
            exit 1
          fi

          echo "Build triggered successfully!"
